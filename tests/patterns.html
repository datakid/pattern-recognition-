<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Number pattern tests</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main>
<h1>Number pattern tests</h1>
<pre id="out"></pre>
</main>
<div hidden>
<textarea id="text-input"></textarea>
<button id="text-run"></button>
<button id="text-sample"></button>
<div id="text-out"></div>
</div>
<script>const $ = s => document.querySelector(s);</script>
<script src="../js/util.js"></script>
<script src="../js/cells.js"></script>
<script src="../js/writing.js"></script>
<script src="../js/sequence.js"></script>
<script src="../js/relations.js"></script>
<script src="../js/textrel.js"></script>
<script src="../js/patterns.js"></script>
<script src="../js/numbers.js"></script>
<script src="../js/text.js"></script>
<script src="../js/textui.js"></script>
<script src="cases.js"></script>
<script>
(async () => {
const out = [];
for (const c of CASES) {
  if (c.node) continue;
  let r;
  try {
    const A = c.src === undefined ? null : TXT.analyze(c.src), N = A ? NUMS.analyze(A) : null;
    r = await c.test(N, A, X);
  } catch (err) { r = 'threw ' + err.message; }
  out.push((r === null ? 'PASS ' : 'FAIL ') + c.name + (r === null ? '' : '\n  ' + r));
}
document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body>
</html>
